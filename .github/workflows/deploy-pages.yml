name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: glyphkeep
      # Interim workaround: package.json's @glyphrogue/* deps are file:
      # references against a local sibling checkout (.claude/dev-session.md's
      # "local dev against glyphrogue" convention - no glyphrogue version
      # bump has been published yet with fixes this build needs). Checking
      # glyphrogue out as an actual sibling here mirrors that local layout
      # so the file: references resolve in CI the same way they do locally.
      # Remove this step (and switch package.json back to a real published
      # semver range) once glyphrogue publishes a version incorporating
      # those fixes.
      - uses: actions/checkout@v4
        with:
          repository: Rhapsydian/glyphrogue
          path: glyphrogue
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # packages/editor's dist/ is gitignored (it's a real Vite library
      # build, not committed source - only packages/core/input export
      # directly from src/, no build step needed for those). glyphkeep's
      # own vite.config.js imports @glyphrogue/editor/devServerPlugin
      # unconditionally (evaluated for any vite command, dev or build),
      # so this has to exist before glyphkeep's own install/build can even
      # load its config, not just for the dev-only entry that actually
      # uses it at runtime.
      - run: npm install
        working-directory: glyphrogue/packages/editor
      - run: npm run build
        working-directory: glyphrogue/packages/editor
      - run: npm install
        working-directory: glyphkeep
      - run: npm run build
        working-directory: glyphkeep
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: glyphkeep/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
